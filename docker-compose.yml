services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: commitquest
      POSTGRES_PASSWORD: commitquest
      POSTGRES_DB: commitquest
    ports:
      - "5432:5432"
    volumes:
      - commitquest_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commitquest -d commitquest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  commitquest_pg:
